schema_version = "1.1"

[task]
name = "algorithmic-bench/wal_crash_recovery_l0"
description = "Implement an ACID Write-Ahead Log (WAL) Crash Recovery Engine in C using the ARIES protocol (Analysis, Redo, and Undo phases). You must recover a corrupted database state after a simulated system crash without data corruption or leaking uncommitted modifications."
authors = [{ name = "PilotCrew", email = "devnull@example.invalid" }]
keywords = ["algorithmic", "c", "database", "wal", "crash-recovery", "aries", "transactions"]

[metadata]
category = "algorithmic"
arvo_id = "wal_crash_recovery_l0"
program = "wal_bench"
crash_type = "none"
sanitizer = "address"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 2048
storage_mb = 10240
allow_internet = true
