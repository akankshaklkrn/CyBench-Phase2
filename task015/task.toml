schema_version = "1.1"

[task]
name = "algorithmic-bench/json_asan_l0"
description = "Implement a custom JSON parser in C that converts raw strings into an AST. It will be compiled with AddressSanitizer (-fsanitize=address). You must allocate and free the entire AST without leaking a single byte of memory or causing any buffer overreads."
authors = [{ name = "PilotCrew", email = "devnull@example.invalid" }]
keywords = ["algorithmic", "c", "memory-safety", "asan", "json", "ast"]

[metadata]
category = "algorithmic"
arvo_id = "json_asan_l0"
program = "json_bench"
crash_type = "none"
sanitizer = "address"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
allow_internet = true
